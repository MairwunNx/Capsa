name: Build

# Documentation, pictures, and their generator build nothing, so a change to them alone runs no build.
on:
  push:
    branches: [master]
    paths-ignore: &docs
      - "docs/**"
      - "**/*.md"
      - "tools/diagrams.py"
  pull_request:
    paths-ignore: *docs

permissions:
  contents: read

# A new push to a pull request cancels its stale run. Every push to master gets a run of its own to the end.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: kotlin

env:
  # Gradle downloads the JDK of a toolchain into jdks/, and setup-gradle caches only caches/ and notifications/ by default.
  GRADLE_CACHE_INCLUDES: |
    caches
    notifications
    jdks

jobs:
  jvm:
    name: JVM and Android host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-includes: ${{ env.GRADLE_CACHE_INCLUDES }}
      - name: Read the Robolectric versions
        id: robolectric
        # Robolectric downloads android-all-instrumented of the SDK it runs into ~/.m2 on the first test, 76 s without the cache.
        run: |
          robolectric=$(sed -nE 's/^robolectric = "(.*)"/\1/p' gradle/libs.versions.toml)
          sdk=$(sed -nE 's/^android-compileSdk = "(.*)"/\1/p' gradle/libs.versions.toml)
          echo "key=robolectric-$robolectric-sdk-$sdk" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-${{ steps.robolectric.outputs.key }}
      - name: Test on the JVM and the Android host, check the public API
        # Only the root reports: a module's own report sees only its own tests and understates capsa-host.
        run: ./gradlew jvmTest testAndroidHostTest apiCheck :koverXmlReport :koverHtmlReport
      - name: Coverage summary
        if: ${{ !cancelled() }}
        shell: python
        # The merged report counts every test of the build, JVM and Android host, so capsa-viewmodel tests cover capsa-host too.
        # A module's own report sees only its own tests. The rows split the merged report by the module that holds each source file.
        run: |
          import glob, os, xml.etree.ElementTree as ET

          KINDS = ("LINE", "BRANCH", "INSTRUCTION")
          path = "build/reports/kover/report.xml"
          if os.path.exists(path):
              owners = {}
              for root in glob.glob("capsa-*/src/*Main/kotlin"):
                  for source in glob.glob(f"{root}/**/*.kt", recursive=True):
                      owners[os.path.relpath(source, root)] = root.split("/")[0]

              def percent(counts):
                  missed, covered = counts
                  return f"{100 * covered / (missed + covered):.1f} %" if missed + covered else "–"

              modules, total = {}, {kind: [0, 0] for kind in KINDS}
              for package in ET.parse(path).getroot().iter("package"):
                  for source in package.iter("sourcefile"):
                      module = owners.get(f"{package.get('name')}/{source.get('name')}", "other")
                      counts = modules.setdefault(module, {kind: [0, 0] for kind in KINDS})
                      for counter in source.iter("counter"):
                          if counter.get("type") in KINDS:
                              for sums in (counts, total):
                                  sums[counter.get("type")][0] += int(counter.get("missed"))
                                  sums[counter.get("type")][1] += int(counter.get("covered"))

              rows = [(name, modules[name]) for name in sorted(modules)] + [("**Total**", total)]
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("### Coverage\n\nEvery JVM and Android host test of the build counts for every module.\n\n")
                  summary.write("| Module | Lines | Branches | Instructions |\n|---|---|---|---|\n")
                  summary.writelines(f"| {name} | {' | '.join(percent(counts[kind]) for kind in KINDS)} |\n" for name, counts in rows)
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: kotlin/build/reports/kover/
      - name: Check the coverage bound
        # The bound lives in build-logic/src/main/kotlin/capsa.coverage.gradle.kts. Locally ./gradlew build checks it, CI runs no build.
        # The tests above are up to date, so this only reads their coverage.
        run: ./gradlew :koverVerify
      - name: Benchmarks, one short iteration
        # Proves that the benchmarks still compile and run. The numbers mean nothing.
        run: ./gradlew :capsa-benchmarks:jvmSmokeBenchmark
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports-jvm
          path: |
            kotlin/*/build/reports/tests/
            kotlin/*/build/test-results/

  apple:
    name: Kotlin/Native on macOS, iOS compilation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-includes: ${{ env.GRADLE_CACHE_INCLUDES }}
      - name: Read the Kotlin version
        id: kotlin
        run: echo "version=$(sed -nE 's/^kotlin = "(.*)"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        # The Kotlin/Native compiler and its LLVM and sysroots, several hundred megabytes for each Kotlin version.
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ steps.kotlin.outputs.version }}
      - name: Run the native tests on macOS, build the iOS tests
        # macosArm64Test runs the Kotlin/Native tests for real. CI has no simulator, so the simulator tests only link.
        # The device target only compiles: linking its test binaries takes minutes and checks nothing the simulator link doesn't.
        run: ./gradlew macosArm64Test linkDebugTestIosSimulatorArm64 compileTestKotlinIosArm64
      - name: Benchmarks, one short iteration
        run: ./gradlew :capsa-benchmarks:macosArm64SmokeBenchmark
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports-apple
          path: |
            kotlin/*/build/reports/tests/
            kotlin/*/build/test-results/

  lint:
    name: detekt and ktlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-includes: ${{ env.GRADLE_CACHE_INCLUDES }}
      - name: Run detekt and ktlint
        # detektSarif merges the reports of every module even when detekt fails on a finding.
        run: ./gradlew detekt ktlintCheck --continue
      - uses: github/codeql-action/upload-sarif@v4
        # Findings show up in the Security tab and on the lines of a pull request.
        # A pull request from a fork gets a read-only token and can't upload: there the lint reports artifact has the findings.
        if: ${{ !cancelled() && !github.event.pull_request.head.repo.fork }}
        with:
          sarif_file: kotlin/build/reports/detekt/detekt.sarif
          category: detekt
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lint-reports
          path: |
            kotlin/*/build/reports/detekt/
            kotlin/*/build/reports/ktlint/
