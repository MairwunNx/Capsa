name: Release

# Run by hand: Actions → Release → Run workflow, with the new version. One run publishes everything:
# the modules to Maven Central, the tag, the GitHub release with its notes, and capsa-skills.zip.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, like 0.99.0"
        required: true
      changelog:
        description: "Changelog in Markdown; leave empty to take the version's section from CHANGELOG.md"
        required: false

# The tag, the release, and the benchmark baseline the run commits to master.
permissions:
  contents: write

concurrency:
  group: release

defaults:
  run:
    working-directory: kotlin

jobs:
  release:
    # Kotlin/Native builds the iOS and macOS artifacts only on macOS.
    runs-on: macos-latest
    env:
      VERSION: ${{ inputs.version }}
      CHANGELOG: ${{ inputs.changelog }}
      # Outside the repository files: .gitignore keeps it out of git.
      NOTES: ${{ github.workspace }}/release-notes.md
      SKILLS_ZIP: ${{ github.workspace }}/capsa-skills.zip
      GRADLE_CACHE_INCLUDES: |
        caches
        notifications
        jdks
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        working-directory: .
        run: |
          [[ "$GITHUB_REF" == refs/heads/master ]] || { echo "::error::Release from master, not from $GITHUB_REF"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::$VERSION isn't a version like 0.99.0"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already released"; exit 1
          fi
      - name: Check the plugin version
        # plugin.json and marketplace.json need no version: without one, Claude Code takes the commit of the plugin's folder,
        # so users follow master. A version, once written, pins users to it, so it must be the version being released.
        working-directory: .
        shell: python3 {0}
        run: |
          import json, os, sys
          from pathlib import Path

          version = os.environ["VERSION"]
          found = []
          plugin = Path("plugins/capsa/.claude-plugin/plugin.json")
          if plugin.exists():
              found.append((str(plugin), json.loads(plugin.read_text(encoding="utf-8")).get("version")))
          marketplace = Path(".claude-plugin/marketplace.json")
          if marketplace.exists():
              for entry in json.loads(marketplace.read_text(encoding="utf-8")).get("plugins", []):
                  found.append((f"{marketplace}, plugin {entry.get('name')}", entry.get("version")))
          wrong = [f"{where} says {pinned}" for where, pinned in found if pinned is not None and pinned != version]
          if wrong:
              sys.exit(f"::error::The plugin version must be {version} or absent: {'; '.join(wrong)}")
      - name: Write the release notes
        working-directory: .
        shell: python3 {0}
        run: |
          import os, re, sys
          version, typed = os.environ["VERSION"], os.environ["CHANGELOG"].strip()
          if typed:
              notes = typed
          else:
              text = open("CHANGELOG.md", encoding="utf-8").read()
              match = re.search(rf"^## {re.escape(version)}\s*$(.*?)(?=^## |\Z)", text, re.M | re.S)
              notes = match.group(1).strip() if match else ""
          if not notes:
              sys.exit(f"::error::No changelog: add a “## {version}” section to CHANGELOG.md or fill the changelog field")
          open(os.environ["NOTES"], "w", encoding="utf-8").write(notes + "\n")
          print(notes)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-includes: ${{ env.GRADLE_CACHE_INCLUDES }}
      - name: Read the Kotlin version
        id: kotlin
        run: echo "version=$(sed -nE 's/^kotlin = "(.*)"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ steps.kotlin.outputs.version }}
      - name: Build and test, run detekt and ktlint
        # build covers every target, the tests, detekt, ktlint, and the API dumps. The coverage bound lives on the root project.
        # The samples ship nowhere, and CI builds them on every push, so the release leaves them out.
        # The androidTarget of the libraries still needs the Android SDK: macos-latest has one in ANDROID_HOME.
        run: >-
          ./gradlew build :koverVerify -PcapsaVersion="$VERSION"
          -x :samples:shared:build -x :samples:androidApp:build -x :samples:desktopApp:build
      - name: Find the benchmark baseline of this runner
        id: baseline
        # The baseline in jvm.json comes from the owner's machine and says nothing about a runner. Each processor gets its own file.
        run: |
          cpu=$(sysctl -n machdep.cpu.brand_string)
          slug=$(echo "$cpu" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-|-$//g')
          path="capsa-benchmarks/baseline/jvm-$slug.json"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          if [[ -f "$path" ]]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
          echo "$cpu: $path"
      - name: Run the benchmarks
        # The JVM run with the GC profiler feeds the comparison. The native run only shows its numbers in the log.
        run: ./gradlew :capsa-benchmarks:jvmGcBenchmark :capsa-benchmarks:macosArm64Benchmark
      - name: Compare with the baseline
        # A release slower than the baseline doesn't ship.
        if: steps.baseline.outputs.exists == 'true'
        run: python3 -I ../tools/bench_compare.py --baseline "${{ steps.baseline.outputs.path }}"
      - name: Write the first baseline of this runner
        # Nothing to compare with yet: this run becomes the baseline, and the step at the end commits it to master.
        if: steps.baseline.outputs.exists != 'true'
        run: python3 -I ../tools/bench_compare.py --write-baseline --baseline "${{ steps.baseline.outputs.path }}"
      - name: Publish to Maven Central
        # A version reaches Central once. Before the upload the step asks the Central Portal about this version:
        # a deployment that Central still validates or publishes, the run waits for instead of uploading it again,
        # a published one it only waits for on repo1, and a failed one stops the run until you drop it in the Portal.
        # The release goes out only once a build can fetch Capsa: repo1.maven.org usually serves a new version within half an hour.
        # capsa.publish.gradle.kts stops the upload when any of the four Gradle secrets is missing.
        shell: python3 {0}
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          import base64, json, os, subprocess, sys, time, urllib.error, urllib.request

          PORTAL = "https://central.sonatype.com/api/v1/publisher"
          version = os.environ["VERSION"]
          pom = f"https://repo1.maven.org/maven2/com/mairwunnx/capsa/capsa-core/{version}/capsa-core-{version}.pom"
          purl = f"pkg:maven/com.mairwunnx.capsa/capsa-core@{version}"


          def on_repo1():
              try:
                  with urllib.request.urlopen(urllib.request.Request(pom, method="HEAD"), timeout=60):
                      return True
              except (urllib.error.URLError, TimeoutError):
                  return False


          def portal(method, path):
              """The Portal's JSON answer. A network error or a 5xx gets four more tries, any other refusal stops the run."""
              for attempt in range(5):
                  request = urllib.request.Request(PORTAL + path, method=method, headers={"Authorization": token, "Accept": "application/json"})
                  try:
                      with urllib.request.urlopen(request, timeout=60) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code < 500:
                          # The answer names the problem and holds no credentials. The token itself is never printed.
                          sys.exit(f"::error::The Central Portal refused {path.split('?')[0]}: HTTP {error.code} {error.read()[:300].decode(errors='replace')}")
                  except (urllib.error.URLError, TimeoutError):
                      pass
                  time.sleep(15)
              sys.exit(f"::error::The Central Portal doesn't answer {path.split('?')[0]}")


          def deployment():
              """The newest deployment that holds capsa-core of this version, or None."""
              page, pages = 0, 1
              while page < min(pages, 10):
                  answer = portal("GET", f"/deployments?page={page}&size=50&sortField=createTimestamp&sortDirection=desc")
                  for item in answer.get("deployments") or []:
                      if any((part.get("purl") or "").split("?")[0] == purl for part in item.get("deploymentComponents") or []):
                          return item
                  page, pages = page + 1, answer.get("pageCount") or 0
              return None


          def refused(deployment_id, errors):
              print(json.dumps(errors, indent=2) if errors else "The Portal gave no details")
              sys.exit(f"::error::Central refused deployment {deployment_id} of {version}, nothing was published. "
                       "Read its errors in the Portal under Publish → Deployments, drop it there, fix the cause, and rerun the workflow")


          if on_repo1():
              print(f"::notice::capsa-core {version} is on Maven Central already, the run skips the upload")
              sys.exit(0)

          user, password = os.environ.get("MAVEN_CENTRAL_USERNAME"), os.environ.get("MAVEN_CENTRAL_PASSWORD")
          if not user or not password:
              sys.exit("::error::The run asks the Central Portal about the version with the MAVEN_CENTRAL_USERNAME and MAVEN_CENTRAL_PASSWORD secrets: set both")
          token = "Bearer " + base64.b64encode(f"{user}:{password}".encode()).decode()

          found = deployment()
          if found is None:
              print(f"No deployment of {version} on the Central Portal yet, uploading", flush=True)
              # The plugin uploads every module as one deployment and waits until Central validates it, so a refusal fails Gradle here.
              gradle = subprocess.run(["./gradlew", "publishAndReleaseToMavenCentral", f"-PcapsaVersion={version}", "--no-configuration-cache"])
              if gradle.returncode:
                  sys.exit(gradle.returncode)
              for _ in range(10):
                  found = deployment()
                  if found:
                      break
                  time.sleep(15)
              else:
                  sys.exit(f"::error::Gradle uploaded {version}, but the Central Portal lists no deployment of it")
          elif found.get("deploymentState") == "FAILED":
              refused(found["deploymentId"], [error for part in found.get("deploymentComponents") or [] for error in part.get("errors") or []])
          elif found.get("deploymentState") == "PUBLISHED":
              print(f"::notice::Central published {version} already in deployment {found['deploymentId']}, the run skips the upload")
          else:
              print(f"::notice::Deployment {found['deploymentId']} of {version} is {found.get('deploymentState')} already, the run waits for it instead of uploading again")

          deployment_id, state, end = found["deploymentId"], None, time.time() + 60 * 60
          while time.time() < end:
              answer = portal("POST", f"/status?id={deployment_id}")
              if answer.get("deploymentState") != state:
                  state = answer.get("deploymentState")
                  print(f"Deployment {deployment_id}: {state}", flush=True)
              if state == "PUBLISHED":
                  break
              if state == "FAILED":
                  refused(deployment_id, answer.get("errors"))
              time.sleep(30)
          else:
              sys.exit(f"::error::Deployment {deployment_id} is still {state} after an hour. VALIDATED waits for Publish in the Portal. "
                       "Otherwise Central may still finish: rerun the workflow, it waits for this deployment again")

          end = time.time() + 60 * 60
          while time.time() < end:
              if on_repo1():
                  print(f"On Maven Central: {pom}")
                  sys.exit(0)
              time.sleep(30)
          sys.exit(f"::error::Central published {version}, but {pom} still answers nothing after an hour: rerun the workflow, it skips the upload")
      - name: Pack the skills
        # The skill folders sit at the root of the archive, so it unpacks straight into a skills folder such as .claude/skills/.
        working-directory: plugins/capsa/skills
        run: zip -r -X "$SKILLS_ZIP" . -x '*.DS_Store'
      - name: Publish the GitHub release
        # 0.x is a preview, and so is a version with a suffix such as 1.0.0-rc.1.
        working-directory: .
        run: |
          prerelease=()
          if [[ "$VERSION" == 0.* || "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Capsa $VERSION" --notes-file "$NOTES" "${prerelease[@]}" "$SKILLS_ZIP"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit the baseline of this runner
        if: steps.baseline.outputs.exists != 'true'
        # A push with the workflow's token starts no other workflow, so the build doesn't run for this commit.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.baseline.outputs.path }}"
          git commit -m "perf(bench): jvm baseline of the release runner" -m "Measured by the release of $VERSION."
          git pull --rebase origin master
          git push origin HEAD:master
