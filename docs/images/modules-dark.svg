<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img">
<title>The modules of Capsa and how they depend on each other</title>
<desc>In kotlin/: capsa-viewmodel and capsa-compose are the two hosts. Both depend on capsa-host, which depends on capsa-core. The hosts don’t depend on each other. capsa-test depends on capsa-core, capsa-viewmodel-test on capsa-viewmodel. capsa-detekt is a plugin for detekt and depends on no module. capsa-bom aligns the versions of all seven. Next to kotlin/ there is room for implementations on other platforms, such as dotnet/ or swift/: none exists yet.</desc>
<defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6e7681"/></marker></defs>
<rect width="900" height="760" rx="12" fill="#0d1117"/>
<rect x="20" y="20" width="860" height="586" rx="14" fill="#161b22" fill-opacity="0.5" stroke="#30363d" stroke-width="1.5"/>
<text x="40" y="48" font-size="15" fill="#e6edf3" font-weight="700" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">kotlin/</text>
<text x="118.04" y="48" font-size="13" fill="#9198a1">an arrow points to what a module depends on</text>
<rect x="40" y="66" width="820" height="52" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="450" y="89" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="middle">capsa-bom</text>
<text x="450" y="109" font-size="13" fill="#9198a1" text-anchor="middle">one version for the seven modules below</text>
<rect x="40" y="140" width="250" height="72" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="165" y="173" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">capsa-viewmodel-test</text>
<text x="165" y="193" font-size="13" fill="#9198a1" text-anchor="middle">capsaViewModel, collectAsScreen</text>
<rect x="640" y="140" width="220" height="72" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="750" y="173" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">capsa-detekt</text>
<text x="750" y="193" font-size="13" fill="#9198a1" text-anchor="middle">rules for detekt 2</text>
<rect x="40" y="250" width="250" height="72" rx="10" fill="#f0883e" fill-opacity="0.14" stroke="#f0883e" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="165" y="283" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">capsa-viewmodel</text>
<text x="165" y="303" font-size="13" fill="#9198a1" text-anchor="middle">CapsaViewModel</text>
<rect x="330" y="250" width="270" height="72" rx="10" fill="#f0883e" fill-opacity="0.14" stroke="#f0883e" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="465" y="283" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">capsa-compose</text>
<text x="465" y="303" font-size="13" fill="#9198a1" text-anchor="middle">rememberCapsa, CollectEffects, Slot</text>
<rect x="640" y="250" width="220" height="72" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="750" y="283" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">capsa-test</text>
<text x="750" y="303" font-size="13" fill="#9198a1" text-anchor="middle">capsaHarness, replay</text>
<rect x="40" y="390" width="560" height="72" rx="10" fill="#f0883e" fill-opacity="0.14" stroke="#f0883e" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="320" y="423" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">capsa-host</text>
<text x="320" y="443" font-size="13" fill="#9198a1" text-anchor="middle">failFast, CapsaLogger, SliceSaver, CapsaEffects</text>
<rect x="40" y="520" width="820" height="60" rx="10" fill="#8b8cf8" fill-opacity="0.14" stroke="#8b8cf8" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="450" y="547" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">capsa-core</text>
<text x="450" y="567" font-size="13" fill="#9198a1" text-anchor="middle">the runtime: capabilities, works, effects, projections. Only kotlinx-coroutines</text>
<path d="M165 212 L165 248" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M165 322 L165 388" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M465 322 L465 388" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M320 462 L320 518" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M750 322 L750 518" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<text x="750" y="236" font-size="12" fill="#9198a1" text-anchor="middle">a plugin of detekt, depends on no module</text>
<path d="M292 286 L328 286" fill="none" stroke="#f85149" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 5"/>
<path d="M305 281 L315 291 M315 281 L305 291" stroke="#f85149" stroke-width="2" stroke-linecap="round"/>
<text x="315" y="356" font-size="12" fill="#f85149" text-anchor="middle">the hosts don’t depend on each other</text>
<text x="450" y="638" font-size="13" fill="#9198a1" text-anchor="middle">Room to grow: another platform would get a folder of its own next to kotlin/</text>
<rect x="20" y="654" width="420" height="64" rx="10" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="230" y="683" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">dotnet/</text>
<text x="230" y="703" font-size="13" fill="#9198a1" text-anchor="middle">for example, F# and Avalonia.FuncUI</text>
<rect x="460" y="654" width="420" height="64" rx="10" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="670" y="683" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">swift/</text>
<text x="670" y="703" font-size="13" fill="#9198a1" text-anchor="middle">for example, Swift and SwiftUI</text>
<text x="450" y="744" font-size="13" fill="#9198a1" text-anchor="middle">None exists yet. Any of them would follow the same rules of Capability Slice Architecture.</text>
</svg>
