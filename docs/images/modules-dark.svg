<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img">
<title>The modules of Capsa and how they depend on each other</title>
<desc>In kotlin/: capsa-viewmodel and capsa-compose are the two hosts. Both depend on capsa-host, which depends on capsa-core. The hosts don’t depend on each other. capsa-test depends on capsa-core. capsa-bom aligns the versions of all five. dotnet/ and swift/ are future implementations next to kotlin/.</desc>
<defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6e7681"/></marker></defs>
<rect width="900" height="640" rx="12" fill="#0d1117"/>
<rect x="20" y="20" width="860" height="476" rx="14" fill="#161b22" fill-opacity="0.5" stroke="#30363d" stroke-width="1.5"/>
<text x="40" y="48" font-size="15" fill="#e6edf3" font-weight="700" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">kotlin/</text>
<text x="118.04" y="48" font-size="13" fill="#9198a1">an arrow points to what a module depends on</text>
<rect x="40" y="66" width="820" height="52" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="450" y="89" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="middle">capsa-bom</text>
<text x="450" y="109" font-size="13" fill="#9198a1" text-anchor="middle">one version for the five modules below</text>
<rect x="40" y="150" width="250" height="72" rx="10" fill="#f0883e" fill-opacity="0.14" stroke="#f0883e" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="165" y="183" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">capsa-viewmodel</text>
<text x="165" y="203" font-size="13" fill="#9198a1" text-anchor="middle">CapsaViewModel</text>
<rect x="330" y="150" width="270" height="72" rx="10" fill="#f0883e" fill-opacity="0.14" stroke="#f0883e" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="465" y="183" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">capsa-compose</text>
<text x="465" y="203" font-size="13" fill="#9198a1" text-anchor="middle">rememberCapsa, CollectEffects, Slot</text>
<rect x="640" y="150" width="220" height="72" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="750" y="183" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">capsa-test</text>
<text x="750" y="203" font-size="13" fill="#9198a1" text-anchor="middle">capsaHarness, replay</text>
<rect x="40" y="290" width="560" height="72" rx="10" fill="#f0883e" fill-opacity="0.14" stroke="#f0883e" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="320" y="323" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">capsa-host</text>
<text x="320" y="343" font-size="13" fill="#9198a1" text-anchor="middle">failFast, CapsaLogger, SliceSaver, CapsaEffects</text>
<rect x="40" y="420" width="820" height="60" rx="10" fill="#8b8cf8" fill-opacity="0.14" stroke="#8b8cf8" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="450" y="447" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">capsa-core</text>
<text x="450" y="467" font-size="13" fill="#9198a1" text-anchor="middle">the runtime: capabilities, works, effects, projections. Only kotlinx-coroutines</text>
<path d="M165 222 L165 288" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M465 222 L465 288" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M320 362 L320 418" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M750 222 L750 418" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M292 186 L328 186" fill="none" stroke="#f85149" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 5"/>
<path d="M305 181 L315 191 M315 181 L305 191" stroke="#f85149" stroke-width="2" stroke-linecap="round"/>
<text x="315" y="256" font-size="12" fill="#f85149" text-anchor="middle">the hosts don’t depend on each other</text>
<rect x="20" y="520" width="420" height="70" rx="10" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="230" y="552" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">dotnet/</text>
<text x="230" y="572" font-size="13" fill="#9198a1" text-anchor="middle">F# and Avalonia.FuncUI, later</text>
<rect x="460" y="520" width="420" height="70" rx="10" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="670" y="552" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">swift/</text>
<text x="670" y="572" font-size="13" fill="#9198a1" text-anchor="middle">Swift and SwiftUI, later</text>
<text x="450" y="618" font-size="13" fill="#9198a1" text-anchor="middle">Each implementation follows the same rules of Capability Slice Architecture.</text>
</svg>
