<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="580" viewBox="0 0 1060 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img">
<title>How a fact flows through a Capsa screen</title>
<desc>1: the UI calls send with an intent, and the runtime queues it with the other facts. 2: the runtime calls decide of a capability with its slice and the fact. 3: decide returns commit with the new slice, works, and effects. 4: the runtime starts a work or a stream, and it answers with a signal. 5: the runtime stores the new slice, mapState or combineState turns it into a UI model, and the UI collects it. 6: effects go to handleEffects of the host first, the rest goes to CollectEffects of the screen. The host is a CapsaViewModel or rememberCapsa.</desc>
<defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6e7681"/></marker></defs>
