<text x="348" y="540" font-size="16" fill="#f0883e" font-weight="700">Host</text>
<text x="396.88" y="540" font-size="13" fill="#9198a1">CapsaViewModel or rememberCapsa { }</text>
<rect x="24" y="200" width="180" height="64" rx="10" fill="#4493f8" fill-opacity="0.14" stroke="#4493f8" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="114" y="229" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">UI</text>
<text x="114" y="249" font-size="13" fill="#9198a1" text-anchor="middle">slots render the ui</text>
<rect x="24" y="436" width="180" height="60" rx="10" fill="#4493f8" fill-opacity="0.14" stroke="#4493f8" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="114" y="463" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="middle">CollectEffects</text>
<text x="114" y="483" font-size="13" fill="#9198a1" text-anchor="middle">navigation, snackbars</text>
<rect x="366" y="200" width="280" height="64" rx="10" fill="#5b52e0" stroke="#5b52e0" stroke-width="1.5"/>
<text x="506" y="229" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">Runtime</text>
<text x="506" y="249" font-size="13" fill="#ffffff" text-anchor="middle" fill-opacity="0.85">queue of facts</text>
<rect x="366" y="322" width="230" height="58" rx="10" fill="#39c5cf" fill-opacity="0.14" stroke="#39c5cf" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="481" y="348" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Projection</text>
<text x="481" y="368" font-size="13" fill="#9198a1" text-anchor="middle">mapState, combineState</text>
<rect x="366" y="438" width="230" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="481" y="464" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="middle">handleEffects()</text>
<text x="481" y="484" font-size="13" fill="#9198a1" text-anchor="middle">analytics, service effects</text>
<rect x="740" y="40" width="296" height="84" rx="10" fill="#ab7df8" fill-opacity="0.14" stroke="#ab7df8" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="888" y="79" font-size="17" fill="#e6edf3" font-weight="700" text-anchor="middle">Capability</text>
<text x="888" y="99" font-size="13" fill="#9198a1" text-anchor="middle">(Slice, Fact) → Decision</text>
<rect x="740" y="200" width="296" height="64" rx="10" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950" stroke-width="1.5" stroke-opacity="0.7"/>
