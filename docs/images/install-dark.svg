<svg xmlns="http://www.w3.org/2000/svg" width="900" height="488" viewBox="0 0 900 488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img">
<title>Three ways to install the skills of Capsa</title>
<desc>1: the Claude Code plugin, claude plugin marketplace add MairwunNx/Capsa and claude plugin install capsa@capsa. 2: npx skills add MairwunNx/Capsa. 3: copy the folders of plugins/capsa/skills into the skills folder of your harness. Each way brings the same five skills: capsa, capsa-setup, capsa-migrate, capsa-new, and capsa-review.</desc>
<defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6e7681"/></marker></defs>
<rect width="900" height="488" rx="12" fill="#0d1117"/>
<rect x="20" y="20" width="800" height="92" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<circle cx="54" cy="66" r="16" fill="#5b52e0"/>
<text x="54" y="72" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="86" y="58" font-size="16" fill="#e6edf3" font-weight="700">Plugin</text>
<text x="86" y="80" font-size="13" fill="#9198a1">Claude Code</text>
<text x="290" y="52" font-size="13" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">claude plugin marketplace add MairwunNx/Capsa</text>
<text x="290" y="74" font-size="13" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">claude plugin install capsa@capsa</text>
<text x="290" y="100" font-size="12" fill="#9198a1">then /capsa:capsa-setup</text>
<path d="M820 66 L860 66" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linejoin="round"/>
<rect x="20" y="124" width="800" height="92" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<circle cx="54" cy="170" r="16" fill="#5b52e0"/>
<text x="54" y="176" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="86" y="162" font-size="16" fill="#e6edf3" font-weight="700">npx skills</text>
<text x="86" y="184" font-size="13" fill="#9198a1">harnesses with skills</text>
<text x="290" y="168" font-size="13" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">npx skills add MairwunNx/Capsa</text>
<text x="290" y="204" font-size="12" fill="#9198a1">then call capsa-setup in your harness</text>
<path d="M820 170 L860 170" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linejoin="round"/>
<rect x="20" y="228" width="800" height="92" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<circle cx="54" cy="274" r="16" fill="#5b52e0"/>
<text x="54" y="280" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="86" y="266" font-size="16" fill="#e6edf3" font-weight="700">Manual copy</text>
<text x="86" y="288" font-size="13" fill="#9198a1">any harness</text>
<text x="290" y="272" font-size="13" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">cp -R plugins/capsa/skills/* .claude/skills/</text>
<text x="290" y="308" font-size="12" fill="#9198a1">from a clone, or into the skills folder your harness reads</text>
<path d="M820 274 L860 274" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M860 64 L860 336" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="20" y="338" width="860" height="130" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="40" y="372" font-size="16" fill="#e6edf3" font-weight="700">Five skills</text>
<text x="131" y="372" font-size="13" fill="#9198a1">the same in every harness</text>
<rect x="40" y="390" width="70.12" height="30" rx="15" fill="#ab7df8" fill-opacity="0.14" stroke="#ab7df8" stroke-width="1" stroke-opacity="0.7"/>
<text x="75.06" y="410" font-size="13" fill="#ab7df8" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">capsa</text>
<rect x="122.12" y="390" width="120.664" height="30" rx="15" fill="#ab7df8" fill-opacity="0.14" stroke="#ab7df8" stroke-width="1" stroke-opacity="0.7"/>
<text x="182.452" y="410" font-size="13" fill="#ab7df8" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">capsa-setup</text>
<rect x="254.784" y="390" width="137.512" height="30" rx="15" fill="#ab7df8" fill-opacity="0.14" stroke="#ab7df8" stroke-width="1" stroke-opacity="0.7"/>
<text x="323.54" y="410" font-size="13" fill="#ab7df8" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">capsa-migrate</text>
<rect x="404.296" y="390" width="103.816" height="30" rx="15" fill="#ab7df8" fill-opacity="0.14" stroke="#ab7df8" stroke-width="1" stroke-opacity="0.7"/>
<text x="456.204" y="410" font-size="13" fill="#ab7df8" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">capsa-new</text>
<rect x="520.112" y="390" width="129.088" height="30" rx="15" fill="#ab7df8" fill-opacity="0.14" stroke="#ab7df8" stroke-width="1" stroke-opacity="0.7"/>
<text x="584.656" y="410" font-size="13" fill="#ab7df8" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">capsa-review</text>
<text x="40" y="448" font-size="13" fill="#9198a1">The agent loads capsa on its own. Start with capsa-setup, then capsa-migrate or capsa-new.</text>
</svg>
