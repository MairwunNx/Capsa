<svg xmlns="http://www.w3.org/2000/svg" width="900" height="372" viewBox="0 0 900 372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img">
<title>A stream with whileVisible pauses while the screen is hidden</title>
<desc>The screen is visible, the timer stream ticks, and the slice counts down. A rotation brings the screen back within the grace of one second, so the stream keeps running. The app goes to the background: the runtime cancels the stream, and no work runs. The app comes back: the runtime calls the block again, and the stream starts from the current value.</desc>
<defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#818b98"/></marker></defs>
<rect width="900" height="372" rx="12" fill="#ffffff"/>
<text x="20" y="36" font-size="15" fill="#1f2328" font-weight="700" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">stream(TICK, whileVisible = true)</text>
<text x="350.76" y="36" font-size="13" fill="#59636e">the runtime pauses the stream while nobody sees the screen</text>
<text x="20" y="86" font-size="14" fill="#1f2328" font-weight="700">screen</text>
<text x="20" y="104" font-size="12" fill="#59636e">collected, in the foreground</text>
<text x="20" y="146" font-size="14" fill="#1f2328" font-weight="700">stream</text>
<text x="20" y="164" font-size="12" fill="#59636e">timer ticks</text>
<text x="20" y="206" font-size="14" fill="#1f2328" font-weight="700">slice</text>
<text x="20" y="224" font-size="12" fill="#59636e">seconds left</text>
