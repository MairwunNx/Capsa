<text x="248.6" y="176" font-size="12" fill="#59636e">each tick is a signal</text>
<rect x="230" y="204" width="644.8" height="24" rx="12" fill="#bf3989" fill-opacity="0.08" stroke="#bf3989" stroke-width="1" stroke-opacity="0.7"/>
