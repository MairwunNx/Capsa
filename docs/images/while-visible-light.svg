<text x="244" y="100" font-size="12" fill="#0969da" font-weight="700">visible</text>
<rect x="664" y="84" width="208.8" height="24" rx="12" fill="#0969da" fill-opacity="0.08" stroke="#0969da" stroke-width="1" stroke-opacity="0.7"/>
<text x="678" y="100" font-size="12" fill="#0969da" font-weight="700">visible</text>
<rect x="492.4" y="84" width="169.6" height="24" rx="12" fill="#818b98" fill-opacity="0.12" stroke="#818b98" stroke-width="1" stroke-dasharray="3 2"/>
<text x="577.2" y="100" font-size="12" fill="#59636e" text-anchor="middle">hidden: in the background</text>
<path d="M354 80 L354 112" stroke="#1f2328" stroke-width="1.2" stroke-dasharray="2 2"/>
<text x="362" y="78" font-size="12" fill="#59636e">rotation: back within the 1 s grace</text>
<rect x="230" y="144" width="260.4" height="14" rx="3" fill="#1a7f37" fill-opacity="0.35" stroke="#1a7f37" stroke-width="1"/>
<path d="M485.4 146 L495.4 156 M495.4 146 L485.4 156" stroke="#cf222e" stroke-width="2" stroke-linecap="round"/>
<text x="577.2" y="155" font-size="12" fill="#59636e" text-anchor="middle">cancelled, no work runs</text>
<path d="M658 132 L670 132 L664 141Z" fill="#1f2328" stroke="#1f2328" stroke-width="1.3"/>
<text x="674" y="140" font-size="12" fill="#59636e">block() again</text>
<rect x="664" y="144" width="210.8" height="14" rx="3" fill="#1a7f37" fill-opacity="0.35" stroke="#1a7f37" stroke-width="1"/>
