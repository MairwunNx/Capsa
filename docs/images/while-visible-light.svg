<text x="434.6" y="220" font-size="12" fill="#bf3989" font-weight="700" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">04:53</text>
<text x="540" y="220" font-size="12" fill="#59636e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">kept: 04:53</text>
<text x="682.6" y="220" font-size="12" fill="#bf3989" font-weight="700" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">04:47</text>
<text x="825.2" y="220" font-size="12" fill="#bf3989" font-weight="700" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">04:41</text>
<path d="M230 254 L874.8 254" fill="none" stroke="#818b98" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#m0)"/>
<text x="874.8" y="276" font-size="13" fill="#59636e" text-anchor="end">time</text>
<text x="20" y="308" font-size="13" fill="#59636e">The runtime counts the screen visible while someone collects a slice, a projection, or effects.flow,</text>
<text x="20" y="328" font-size="13" fill="#59636e">and the app is in the foreground. After the last collector leaves, it waits one second,</text>
<text x="20" y="348" font-size="13" fill="#59636e">so a rotation doesn’t restart the stream. On return the timer computes the time left from its deadline.</text>
</svg>
