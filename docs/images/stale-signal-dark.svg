<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img">
<title>An old answer comes after the new one, and the runtime drops it</title>
<desc>The UI sends a query “ca”, and work 1 starts. Then it sends “cat”: WorkPolicy.Latest cancels work 1 and starts work 2 under the same key. Work 2 answers first, and the slice shows the results for “cat”. The request of work 1 still runs and answers later, but the runtime drops that signal, so the slice keeps “cat”.</desc>
<style>.r0{animation:r0 10s linear infinite}@keyframes r0{0%,3.77%{opacity:0}4.37%,96%{opacity:1}100%{opacity:0}}.r1{animation:r1 10s linear infinite}@keyframes r1{0%,18.87%{opacity:0}19.47%,96%{opacity:1}100%{opacity:0}}.r2{animation:r2 10s linear infinite;transform-box:fill-box;transform-origin:0 50%}@keyframes r2{0%,3.77%{opacity:0;transform:scaleX(0)}3.78%{opacity:1;transform:scaleX(0)}18.87%,96%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1)}}.r3{animation:r3 10s linear infinite;transform-box:fill-box;transform-origin:0 50%}@keyframes r3{0%,18.87%{opacity:0;transform:scaleX(0)}18.88%{opacity:1;transform:scaleX(0)}52.83%,96%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1)}}.r4{animation:r4 10s linear infinite}@keyframes r4{0%,18.87%{opacity:0}19.47%,96%{opacity:1}100%{opacity:0}}.r5{animation:r5 10s linear infinite}@keyframes r5{0%,52.83%{opacity:0}53.43%,96%{opacity:1}100%{opacity:0}}.r6{animation:r6 10s linear infinite;transform-box:fill-box;transform-origin:0 50%}@keyframes r6{0%,18.87%{opacity:0;transform:scaleX(0)}18.88%{opacity:1;transform:scaleX(0)}37.74%,96%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1)}}.r7{animation:r7 10s linear infinite}@keyframes r7{0%,37.74%{opacity:0}38.34%,96%{opacity:1}100%{opacity:0}}.r8{animation:r8 10s linear infinite;transform-box:fill-box;transform-origin:0 50%}@keyframes r8{0%,3.77%{opacity:0;transform:scaleX(0)}3.78%{opacity:1;transform:scaleX(0)}37.74%,96%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1)}}.r9{animation:r9 10s linear infinite}@keyframes r9{0%,37.74%{opacity:0}38.34%,96%{opacity:1}100%{opacity:0}}.r10{animation:r10 10s linear infinite}@keyframes r10{0%,54.34%{opacity:0}54.94%,96%{opacity:1}100%{opacity:0}}.head{animation:head 10s linear infinite}@keyframes head{0%{transform:translateX(0);opacity:1}80.00%{transform:translateX(657.2px);opacity:1}82.00%,100%{transform:translateX(657.2px);opacity:0}}@media (prefers-reduced-motion: reduce){.anim{animation:none}.head{display:none}}</style>
<defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#3fb950"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6e7681"/></marker></defs>
<rect width="900" height="360" rx="12" fill="#0d1117"/>
<text x="20" y="36" font-size="16" fill="#e6edf3" font-weight="700">WorkPolicy.Latest</text>
<text x="179.04" y="36" font-size="13" fill="#9198a1">a new query cancels the old work, and its late answer never reaches the slice</text>
<text x="20" y="94" font-size="14" fill="#e6edf3" font-weight="700">UI</text>
<text x="20" y="112" font-size="12" fill="#9198a1">send(QueryChanged)</text>
<text x="20" y="150" font-size="14" fill="#e6edf3" font-weight="700">work 1</text>
<text x="20" y="168" font-size="12" fill="#9198a1">key SEARCH, “ca”</text>
<text x="20" y="206" font-size="14" fill="#e6edf3" font-weight="700">work 2</text>
<text x="20" y="224" font-size="12" fill="#9198a1">key SEARCH, “cat”</text>
<text x="20" y="262" font-size="14" fill="#e6edf3" font-weight="700">slice</text>
<text x="20" y="280" font-size="12" fill="#9198a1">SearchSlice</text>
<path d="M220 128 L887.2 128" stroke="#30363d" stroke-width="1"/>
<path d="M220 184 L887.2 184" stroke="#30363d" stroke-width="1"/>
<path d="M220 240 L887.2 240" stroke="#30363d" stroke-width="1"/>
<g class="anim r0"><path d="M255 88 L267 88 L261 97Z" fill="#4493f8" stroke="#4493f8" stroke-width="1.3"/><text x="271" y="97" font-size="13" fill="#4493f8" font-weight="700">“ca”</text></g>
<g class="anim r1"><path d="M379 88 L391 88 L385 97Z" fill="#4493f8" stroke="#4493f8" stroke-width="1.3"/><text x="395" y="97" font-size="13" fill="#4493f8" font-weight="700">“cat”</text></g>
<g class="anim r2"><rect x="261" y="148" width="124" height="14" rx="3" fill="#3fb950" fill-opacity="0.35" stroke="#3fb950" stroke-width="1"/></g>
<g class="anim r3"><rect x="385" y="148" width="279" height="14" rx="3" fill="#6e7681" fill-opacity="0.18" stroke="#6e7681" stroke-width="1" stroke-dasharray="3 2"/></g>
<g class="anim r4"><path d="M380 150 L390 160 M390 150 L380 160" stroke="#f85149" stroke-width="2" stroke-linecap="round"/><text x="395" y="177" font-size="12" fill="#9198a1">cancelled, but the request still runs</text></g>
<g class="anim r5"><circle cx="674" cy="155" r="6" fill="#6e7681"/><path d="M674 162 L674 236" fill="none" stroke="#6e7681" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="M668 226 L680 238 M680 226 L668 238" stroke="#f85149" stroke-width="2" stroke-linecap="round"/><text x="688" y="160" font-size="13" fill="#f85149" font-weight="700">late answer: dropped</text></g>
<g class="anim r6"><rect x="385" y="204" width="155" height="14" rx="3" fill="#3fb950" fill-opacity="0.35" stroke="#3fb950" stroke-width="1"/></g>
<g class="anim r7"><circle cx="550" cy="211" r="6" fill="#3fb950"/><text x="562" y="216" font-size="13" fill="#3fb950" font-weight="700">ResultsLoaded</text><path d="M550 218 L550 256" fill="none" stroke="#3fb950" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m0)"/></g>
<g class="anim r8"><rect x="261" y="258" width="279" height="22" rx="11" fill="#6e7681" fill-opacity="0.15" stroke="#6e7681" stroke-width="1"/><text x="273" y="273" font-size="12" fill="#9198a1">loading</text></g>
<g class="anim r9"><rect x="542" y="258" width="345.2" height="22" rx="11" fill="#db61a2" fill-opacity="0.14" stroke="#db61a2" stroke-width="1" stroke-opacity="0.7"/><text x="564" y="273" font-size="12" fill="#db61a2" font-weight="700">results for “cat”</text></g>
<g class="anim r10"><text x="688" y="273" font-size="12" fill="#9198a1">still “cat”</text></g>
<path d="M230 316 L887.2 316" fill="none" stroke="#6e7681" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#m1)"/>
<text x="887.2" y="338" font-size="13" fill="#9198a1" text-anchor="end">time</text>
<text x="20" y="338" font-size="12" fill="#9198a1">Harness tests see it as WorkEvent.Dropped.</text>
<path class="head" d="M230 64 L230 300" stroke="#8b8cf8" stroke-width="1.5" stroke-dasharray="3 3"/>
</svg>
